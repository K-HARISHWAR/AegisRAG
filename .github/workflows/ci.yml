name: AegisRAG CI & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-tests:
    name: Backend Quality & Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install pytest pytest-asyncio anyio ruff

      - name: Code Quality & Lint
        run: |
          ruff check backend/app backend/tests

      - name: Run Pytest Regression Suite
        run: |
          pytest backend/tests/ -v --tb=short
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars-long!
          LOG_LEVEL: INFO

  continuous-evaluation:
    name: Continuous Grounding & Evidence Benchmark
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/

      - name: Run Golden Benchmark Evaluation
        run: |
          python evals/run_continuous_eval.py
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars-long!

  frontend-quality-and-build:
    name: Frontend Tests & Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Production Distribution
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Security & Secret Sanitization Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Tracked Secrets or Environment Files
        run: |
          # Verify .env is not tracked
          if git ls-files | grep -E "(^\.env$|\.env\.local$|\.pem$|\.key$)"; then
            echo "ERROR: Sensitive file committed to Git index!"
            exit 1
          fi
          echo "Secret sanitization check passed: No environment or private key files tracked."
